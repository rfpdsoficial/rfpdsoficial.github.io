<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<title>Infinito Sequencial</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #111;
    color: white;
    font-family: 'Courier New', monospace;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    user-select: none;
    touch-action: none;
}

#game-container {
    flex: 1;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    overflow: hidden;
}

canvas {
    background: #050505;
    display: block;
}

#ui-layer {
    position: absolute;
    top: 10px;
    left: 0;
    width: 100%;
    text-align: center;
    pointer-events: none;
    z-index: 10;
    text-shadow: 2px 2px 4px #000;
}

#level-text {
    font-size: 23px;
    font-weight: bold;
    color: #00ccff;
}

#status-text {
    font-size: 14px;
    color: #aaa;
    margin-top: 5px;
}

#controls {
    height: 180px;
    background: #1a1a1a;

    display: grid;

    grid-template-columns:
    1fr 1fr 1fr;

    grid-template-rows:
    1fr 1fr;

    gap: 8px;

    padding: 10px;
    padding-bottom: 25px;
}

.btn {
    background: #333;

    border-radius: 12px;

    border: 2px solid #444;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 24px;

    color: #888;

    transition: 0.08s;
}

.btn.active {
    background: #00ccff;
    border-color: white;
    color: black;

    box-shadow:
    0 0 12px #00ccff;
}

#btn-up {
    grid-column: 2;
    grid-row: 1;
}

#btn-left {
    grid-column: 1;
    grid-row: 2;
}

#btn-down {
    grid-column: 2;
    grid-row: 2;
}

#btn-right {
    grid-column: 3;
    grid-row: 2;
}

</style>
</head>

<body>

<div id="game-container">

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">

        <div id="level-text">
            NÍVEL 1
        </div>

        <div id="status-text">
            Carregando...
        </div>

    </div>

</div>

<div id="controls">

    <div class="btn" id="btn-up">▲</div>

    <div class="btn" id="btn-left">◀</div>

    <div class="btn" id="btn-down">▼</div>

    <div class="btn" id="btn-right">▶</div>

</div>


<script>

const canvas =
document.getElementById("gameCanvas");

const ctx =
canvas.getContext("2d");

const levelText =
document.getElementById("level-text");

const statusText =
document.getElementById("status-text");


/* =====================================================
   ESTADO
===================================================== */

let currentLevel = 1;

let levelTransition = false;

let gameReady = false;

let keys = {
    up: false,
    down: false,
    left: false,
    right: false
};

let walls = [];

let enemies = [];


/* =====================================================
   JOGADOR
===================================================== */

const player = {

    x: 0,
    y: 0,

    size: 20,

    speed: 4,

    color: "#00ccff"
};


/* =====================================================
   OBJETIVO
===================================================== */

const goal = {

    x: 0,
    y: 0,

    size: 24,

    color: "#00ff00"
};


/* =====================================================
   DIFICULDADE
===================================================== */

function difficulty(level) {

    /*
       A dificuldade depende SOMENTE
       do número do nível.

       Portanto:

       1 < 2 < 3 < 4 < 5...
    */

    const walls =
        Math.min(
            2 + Math.floor(level * 0.55),
            18
        );

    const enemies =
        Math.min(
            3 + Math.floor(level * 1.1),
            120
        );

    const speed =
        Math.min(
            1.8 + level * 0.075,
            9
        );

    return {
        walls,
        enemies,
        speed
    };
}


/* =====================================================
   REDIMENSIONAMENTO
===================================================== */

function resize() {

    const container =
    document.getElementById("game-container");

    const oldWidth = canvas.width;
    const oldHeight = canvas.height;

    canvas.width =
    container.clientWidth;

    canvas.height =
    container.clientHeight;


    player.size =
        Math.max(
            12,
            canvas.width * 0.04
        );

    player.speed =
        Math.max(
            2.5,
            player.size * 0.48
        );

    goal.size =
        player.size + 4;


    /*
       Se o jogo já estava rodando,
       apenas adapta as posições.

       NÃO cria outro nível.
    */

    if (
        gameReady &&
        oldWidth > 0 &&
        oldHeight > 0
    ) {

        const scaleX =
            canvas.width / oldWidth;

        const scaleY =
            canvas.height / oldHeight;


        player.x *= scaleX;
        player.y *= scaleY;

        goal.x *= scaleX;
        goal.y *= scaleY;


        for (const w of walls) {

            w.x *= scaleX;
            w.y *= scaleY;

            w.w *= scaleX;
            w.h *= scaleY;
        }


        for (const e of enemies) {

            e.x *= scaleX;
            e.y *= scaleY;
        }
    }
}


/* =====================================================
   COLISÃO
===================================================== */

function rectIntersect(
    x1, y1, w1, h1,
    x2, y2, w2, h2
) {

    return (
        x2 < x1 + w1 &&
        x2 + w2 > x1 &&
        y2 < y1 + h1 &&
        y2 + h2 > y1
    );
}


function collision(obj, list) {

    for (const w of list) {

        if (
            rectIntersect(
                obj.x,
                obj.y,
                obj.size,
                obj.size,

                w.x,
                w.y,
                w.w,
                w.h
            )
        ) {
            return true;
        }
    }

    return false;
}


/* =====================================================
   GERADOR DE PAREDES
===================================================== */

function createWalls(level) {

    const config =
        difficulty(level);

    /*
       Tentamos vários mapas até encontrar
       um que tenha caminho possível.
    */

    for (let attempt = 0; attempt < 100; attempt++) {

        walls = [];


        for (
            let i = 0;
            i < config.walls;
            i++
        ) {

            const thickness =
                Math.max(
                    6,
                    canvas.width * 0.018
                );


            let w;
            let h;
            let x;
            let y;


            if (Math.random() < 0.5) {

                /* Horizontal */

                w =
                    canvas.width *
                    (0.20 + Math.random() * 0.35);

                h = thickness;

                x =
                    Math.random() *
                    Math.max(
                        1,
                        canvas.width - w
                    );

                y =
                    60 +
                    Math.random() *
                    Math.max(
                        1,
                        canvas.height - 120
                    );

            } else {

                /* Vertical */

                w = thickness;

                h =
                    canvas.height *
                    (0.20 + Math.random() * 0.35);

                x =
                    50 +
                    Math.random() *
                    Math.max(
                        1,
                        canvas.width - 100
                    );

                y =
                    Math.random() *
                    Math.max(
                        1,
                        canvas.height - h
                    );
            }


            const wall = {
                x,
                y,
                w,
                h
            };


            /*
               Não deixa parede nascer
               colada ao início.
            */

            if (
                rectIntersect(
                    player.x - 55,
                    player.y - 55,
                    player.size + 110,
                    player.size + 110,

                    x,
                    y,
                    w,
                    h
                )
            ) {
                continue;
            }


            /*
               Não deixa parede nascer
               colada ao objetivo.
            */

            if (
                rectIntersect(
                    goal.x - 55,
                    goal.y - 55,
                    goal.size + 110,
                    goal.size + 110,

                    x,
                    y,
                    w,
                    h
                )
            ) {
                continue;
            }


            walls.push(wall);
        }


        /*
           AQUI ESTÁ A CORREÇÃO IMPORTANTE:
           verificamos se existe caminho.
        */

        if (hasPath()) {

            return true;
        }
    }


    /*
       Se por algum motivo não encontrou mapa
       em 100 tentativas, cria um mapa simples.
    */

    walls = [];

    return true;
}


/* =====================================================
   VERIFICADOR DE CAMINHO
===================================================== */

function hasPath() {

    /*
       Transformamos o mapa em uma grade.

       Isso serve para descobrir se o jogador
       consegue chegar ao objetivo sem atravessar
       uma parede.
    */

    const cols = 20;
    const rows = 20;

    const cellW =
        canvas.width / cols;

    const cellH =
        canvas.height / rows;


    const blocked = [];


    for (let y = 0; y < rows; y++) {

        blocked[y] = [];

        for (let x = 0; x < cols; x++) {

            const cx =
                x * cellW;

            const cy =
                y * cellH;

            const sizeX =
                cellW;

            const sizeY =
                cellH;


            blocked[y][x] = false;


            for (const wall of walls) {

                if (
                    rectIntersect(
                        cx,
                        cy,
                        sizeX,
                        sizeY,

                        wall.x,
                        wall.y,
                        wall.w,
                        wall.h
                    )
                ) {

                    blocked[y][x] = true;

                    break;
                }
            }
        }
    }


    function cellAt(x, y) {

        return {
            x: Math.floor(
                x / cellW
            ),

            y: Math.floor(
                y / cellH
            )
        };
    }


    const start =
        cellAt(
            player.x,
            player.y
        );

    const end =
        cellAt(
            goal.x,
            goal.y
        );


    /*
       BFS
    */

    const queue = [start];

    const visited = new Set();

    visited.add(
        start.x + "," + start.y
    );


    const directions = [
        [1, 0],
        [-1, 0],
        [0, 1],
        [0, -1]
    ];


    while (queue.length > 0) {

        const current =
            queue.shift();


        if (
            current.x === end.x &&
            current.y === end.y
        ) {

            return true;
        }


        for (
            const direction of directions
        ) {

            const nx =
                current.x +
                direction[0];

            const ny =
                current.y +
                direction[1];


            if (
                nx < 0 ||
                ny < 0 ||
                nx >= cols ||
                ny >= rows
            ) {
                continue;
            }


            if (blocked[ny][nx]) {
                continue;
            }


            const key =
                nx + "," + ny;


            if (
                visited.has(key)
            ) {
                continue;
            }


            visited.add(key);


            queue.push({
                x: nx,
                y: ny
            });
        }
    }


    return false;
}


/* =====================================================
   INIMIGOS
===================================================== */

function createEnemies(level) {

    enemies = [];


    const config =
        difficulty(level);


    for (
        let i = 0;
        i < config.enemies;
        i++
    ) {

        let x;
        let y;

        let safe = false;

        let size;


        for (
            let attempt = 0;
            attempt < 100;
            attempt++
        ) {

            size =
                player.size *
                (0.7 + Math.random() * 0.45);


            x =
                Math.random() *
                (canvas.width - size);


            y =
                Math.random() *
                (canvas.height - size);


            const farPlayer =
                Math.hypot(
                    x - player.x,
                    y - player.y
                ) > 140;


            const farGoal =
                Math.hypot(
                    x - goal.x,
                    y - goal.y
                ) > 100;


            const temp = {
                x,
                y,
                size
            };


            const free =
                !collision(
                    temp,
                    walls
                );


            if (
                farPlayer &&
                farGoal &&
                free
            ) {

                safe = true;

                break;
            }
        }


        /*
           Se não encontrou posição,
           coloca fora da área inicial.
        */

        if (!safe) {

            x =
                canvas.width -
                size -
                10;

            y =
                canvas.height / 2;
        }


        const angle =
            Math.random() *
            Math.PI * 2;


        const speed =
            config.speed *
            (0.85 + Math.random() * 0.3);


        enemies.push({

            x,
            y,

            size,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            color:
                `hsl(${5 + (level % 45)},100%,50%)`
        });
    }
}


/* =====================================================
   GERAR NÍVEL
===================================================== */

function generateLevel(level) {

    /*
       O nível recebido é SEMPRE o nível atual.

       Nunca usamos Math.random()
       para determinar o número do nível.
    */

    currentLevel = level;


    levelText.innerText =
        "NÍVEL " + currentLevel;


    statusText.style.color =
        "#aaa";


    statusText.innerText =
        "Gerando mapa...";


    player.x =
        player.size + 8;

    player.y =
        player.size + 8;


    goal.x =
        canvas.width -
        goal.size -
        10;

    goal.y =
        canvas.height -
        goal.size -
        10;


    /*
       Primeiro cria paredes.
    */

    createWalls(currentLevel);


    /*
       Depois inimigos.
    */

    createEnemies(currentLevel);


    const config =
        difficulty(currentLevel);


    statusText.innerText =
        config.enemies +
        " inimigos | " +
        config.walls +
        " paredes | Vel. " +
        config.speed.toFixed(1);


    gameReady = true;
}


/* =====================================================
   ATUALIZAR INIMIGOS
===================================================== */

function updateEnemies() {

    for (const e of enemies) {

        const oldX = e.x;
        const oldY = e.y;


        e.x += e.vx;
        e.y += e.vy;


        /*
           Bordas.
        */

        if (
            e.x <= 0 ||
            e.x + e.size >= canvas.width
        ) {

            e.x = oldX;

            e.vx *= -1;
        }


        if (
            e.y <= 0 ||
            e.y + e.size >= canvas.height
        ) {

            e.y = oldY;

            e.vy *= -1;
        }


        /*
           Parede.
        */

        if (
            collision(e, walls)
        ) {

            e.x = oldX;
            e.y = oldY;

            e.vx *= -1;
            e.vy *= -1;
        }
    }
}


/* =====================================================
   UPDATE
===================================================== */

function update() {

    if (
        !gameReady ||
        levelTransition
    ) {
        return;
    }


    /*
       Movimento.
    */

    if (keys.up)
        player.y -= player.speed;

    if (keys.down)
        player.y += player.speed;

    if (keys.left)
        player.x -= player.speed;

    if (keys.right)
        player.x += player.speed;


    /*
       Limites.
    */

    player.x =
        Math.max(
            0,
            Math.min(
                player.x,
                canvas.width -
                player.size
            )
        );


    player.y =
        Math.max(
            0,
            Math.min(
                player.y,
                canvas.height -
                player.size
            )
        );


    /*
       Parede.
    */

    if (
        collision(
            player,
            walls
        )
    ) {

        die(
            "Bateu na parede!"
        );

        return;
    }


    /*
       Inimigos.
    */

    updateEnemies();


    /*
       Colisão com inimigos.
    */

    for (const e of enemies) {

        if (
            rectIntersect(
                player.x,
                player.y,
                player.size,
                player.size,

                e.x,
                e.y,
                e.size,
                e.size
            )
        ) {

            die("PEGOU!");

            return;
        }
    }


    /*
       OBJETIVO
    */

    if (
        rectIntersect(
            player.x,
            player.y,
            player.size,
            player.size,

            goal.x,
            goal.y,
            goal.size,
            goal.size
        )
    ) {

        winLevel();
    }
}


/* =====================================================
   VITÓRIA
===================================================== */

function winLevel() {

    if (levelTransition) {
        return;
    }


    levelTransition = true;


    statusText.innerText =
        "NÍVEL " +
        currentLevel +
        " CONCLUÍDO!";


    statusText.style.color =
        "#00ff00";


    setTimeout(() => {

        /*
           A ÚNICA forma de aumentar o nível.

           1 + 1 = 2
           2 + 1 = 3
           3 + 1 = 4
           ...
        */

        currentLevel++;


        levelTransition = false;


        generateLevel(
            currentLevel
        );

    }, 600);
}


/* =====================================================
   MORTE
===================================================== */

function die(reason) {

    statusText.innerText =
        reason +
        " Tentando novamente...";


    statusText.style.color =
        "#ff2222";


    /*
       Efeito vermelho.
    */

    ctx.fillStyle =
        "rgba(255,0,0,0.35)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    setTimeout(() => {

        /*
           MUITO IMPORTANTE:

           O nível NÃO muda.

           Se morreu no 7,
           continua no 7.

           Se morreu no 100,
           continua no 100.
        */

        player.x =
            player.size + 8;

        player.y =
            player.size + 8;


        statusText.style.color =
            "#aaa";


        const config =
            difficulty(
                currentLevel
            );


        statusText.innerText =
            config.enemies +
            " inimigos | " +
            config.walls +
            " paredes | Vel. " +
            config.speed.toFixed(1);

    }, 450);
}


/* =====================================================
   DESENHO
===================================================== */

function draw() {

    ctx.fillStyle =
        "#050505";


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       Paredes.
    */

    ctx.fillStyle =
        "#555";


    for (const w of walls) {

        ctx.fillRect(
            w.x,
            w.y,
            w.w,
            w.h
        );
    }


    /*
       Objetivo.
    */

    ctx.fillStyle =
        goal.color;


    ctx.shadowBlur = 15;

    ctx.shadowColor =
        goal.color;


    ctx.fillRect(
        goal.x,
        goal.y,
        goal.size,
        goal.size
    );


    ctx.shadowBlur = 0;


    /*
       Jogador.
    */

    ctx.fillStyle =
        player.color;


    ctx.fillRect(
        player.x,
        player.y,
        player.size,
        player.size
    );


    /*
       Inimigos.
    */

    for (const e of enemies) {

        ctx.fillStyle =
            e.color;


        ctx.fillRect(
            e.x,
            e.y,
            e.size,
            e.size
        );
    }
}


/* =====================================================
   LOOP
===================================================== */

function loop() {

    update();

    draw();

    requestAnimationFrame(loop);
}


/* =====================================================
   BOTÕES
===================================================== */

function setupButton(
    id,
    key
) {

    const button =
        document.getElementById(id);


    function start(e) {

        e.preventDefault();

        keys[key] = true;

        button.classList.add(
            "active"
        );
    }


    function end(e) {

        e.preventDefault();

        keys[key] = false;

        button.classList.remove(
            "active"
        );
    }


    button.addEventListener(
        "touchstart",
        start,
        { passive: false }
    );


    button.addEventListener(
        "touchend",
        end,
        { passive: false }
    );


    button.addEventListener(
        "touchcancel",
        end,
        { passive: false }
    );


    button.addEventListener(
        "mousedown",
        start
    );


    button.addEventListener(
        "mouseup",
        end
    );


    button.addEventListener(
        "mouseleave",
        end
    );
}


setupButton(
    "btn-up",
    "up"
);

setupButton(
    "btn-down",
    "down"
);

setupButton(
    "btn-left",
    "left"
);

setupButton(
    "btn-right",
    "right"
);


/* =====================================================
   TECLADO
===================================================== */

window.addEventListener(
    "keydown",
    e => {

        if (e.key === "ArrowUp")
            keys.up = true;

        if (e.key === "ArrowDown")
            keys.down = true;

        if (e.key === "ArrowLeft")
            keys.left = true;

        if (e.key === "ArrowRight")
            keys.right = true;
    }
);


window.addEventListener(
    "keyup",
    e => {

        if (e.key === "ArrowUp")
            keys.up = false;

        if (e.key === "ArrowDown")
            keys.down = false;

        if (e.key === "ArrowLeft")
            keys.left = false;

        if (e.key === "ArrowRight")
            keys.right = false;
    }
);


/* =====================================================
   INICIAR
===================================================== */

resize();

generateLevel(1);

loop();

</script>

</body>
</html>
