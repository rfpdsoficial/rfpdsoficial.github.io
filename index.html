<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Chat P2P</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#0f1115;
    color:white;
    display:flex;
    justify-content:center;
}

.chat{
    width:100%;
    max-width:700px;
    height:100dvh;
    background:#181b21;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
}

/* HEADER */

.header{
    min-height:65px;
    padding:10px 14px;
    background:#20242c;
    border-bottom:1px solid #30343d;

    display:flex;
    align-items:center;
    justify-content:space-between;

    flex-shrink:0;
}

.header-left{
    min-width:0;
}

.header h1{
    font-size:20px;
}

.status{
    margin-top:5px;
    font-size:12px;
    color:#999;
}

#status{
    color:#ffb000;
}

/* MENU */

.menu-button{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:transparent;
    color:white;
    font-size:27px;
    cursor:pointer;
}

.menu-button:hover{
    background:#30343d;
}

.menu{
    position:absolute;
    top:58px;
    right:10px;

    width:230px;

    background:#252a33;
    border:1px solid #383e49;
    border-radius:10px;

    padding:6px;

    display:none;

    z-index:300;

    box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.menu.active{
    display:block;
}

.menu-title{
    padding:10px;
    font-size:11px;
    color:#888;
}

.menu-item{
    width:100%;
    border:0;
    background:transparent;
    color:white;
    text-align:left;
    padding:12px;
    border-radius:7px;
    cursor:pointer;
}

.menu-item:hover{
    background:#303640;
}

/* CONEXÃO */

.connection{
    padding:12px;
    background:#15181d;
    border-bottom:1px solid #292d35;
    display:none;
}

.connection.active{
    display:block;
}

.connection label{
    display:block;
    font-size:12px;
    color:#aaa;
    margin-bottom:5px;
}

.connection-row{
    display:flex;
    gap:8px;
}

.connection input{
    flex:1;
    min-width:0;

    padding:11px;

    border:1px solid #363b45;
    border-radius:8px;

    background:#22262e;
    color:white;

    outline:none;
}

.connection button{
    border:0;
    border-radius:8px;

    padding:0 14px;

    background:#3b82f6;
    color:white;

    cursor:pointer;
}

/* MENSAGENS */

.messages{
    flex:1;
    min-height:0;

    overflow-y:auto;

    padding:15px;

    display:flex;
    flex-direction:column;

    gap:10px;
}

/* MENSAGEM */

.message{
    max-width:80%;

    padding:9px 13px;

    border-radius:13px;

    background:#292e38;

    align-self:flex-start;

    word-break:break-word;
}

.message.me{
    background:#2563eb;
    align-self:flex-end;
}

.message .name{
    font-size:10px;
    color:#aaa;
    margin-bottom:4px;
}

.message .text{
    font-size:15px;
    line-height:1.4;
}

/* SALAS */

.rooms{
    margin-top:5px;
}

.rooms-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;

    margin-bottom:10px;
}

.rooms-title h2{
    font-size:17px;
}

.create-room{
    border:0;
    background:#3b82f6;
    color:white;

    padding:8px 11px;

    border-radius:7px;

    cursor:pointer;

    white-space:nowrap;
}

.room-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.room{
    background:#22262e;
    border:1px solid #303640;
    border-radius:10px;

    padding:12px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;
}

.room-info{
    min-width:0;
    flex:1;
}

.room-name{
    font-size:14px;
    font-weight:bold;
    margin-bottom:4px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.room-users{
    font-size:12px;
    color:#888;
}

.join-room{
    border:0;
    background:#3b82f6;
    color:white;

    padding:8px 12px;

    border-radius:7px;

    cursor:pointer;

    flex-shrink:0;
}

.current-room{
    display:none;

    background:#20242c;

    border:1px solid #303640;

    border-radius:10px;

    padding:12px;

    margin-top:10px;
}

.current-room.active{
    display:block;
}

.current-room-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.current-room-name{
    min-width:0;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;

    font-size:14px;
    font-weight:bold;
}

.leave-room{
    border:0;
    background:#dc2626;
    color:white;

    padding:7px 10px;

    border-radius:7px;

    cursor:pointer;
}

/* EMOJIS */

.emoji-panel{
    position:absolute;

    bottom:70px;
    left:10px;

    width:min(290px,calc(100vw - 20px));

    max-height:220px;

    overflow-y:auto;

    background:#252a33;

    border:1px solid #383e49;

    border-radius:12px;

    padding:10px;

    display:none;

    grid-template-columns:repeat(7,1fr);

    gap:4px;

    z-index:200;
}

.emoji-panel.active{
    display:grid;
}

.emoji-panel button{
    aspect-ratio:1;

    border:0;
    background:transparent;

    color:white;

    font-size:23px;

    border-radius:7px;

    cursor:pointer;
}

.emoji-panel button:hover{
    background:#303640;
}

/* INPUT */

.input-area{
    min-height:62px;

    padding:8px 10px;

    background:#20242c;

    border-top:1px solid #30343d;

    display:flex;
    align-items:center;

    gap:7px;

    flex-shrink:0;

    padding-bottom:max(8px,env(safe-area-inset-bottom));
}

.emoji-button{
    width:44px;
    height:44px;

    border:0;
    border-radius:50%;

    background:transparent;

    color:white;

    font-size:22px;

    cursor:pointer;

    flex-shrink:0;
}

.input-area input{
    flex:1;
    min-width:0;

    height:44px;

    padding:0 14px;

    border:1px solid #363b45;

    border-radius:22px;

    background:#292e38;

    color:white;

    outline:none;

    font-size:15px;
}

.send{
    width:44px;
    height:44px;

    border:0;
    border-radius:50%;

    background:#3b82f6;

    color:white;

    font-size:18px;

    cursor:pointer;

    flex-shrink:0;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.65);

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    z-index:500;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:min(350px,100%);

    background:#20242c;

    border:1px solid #383e49;

    border-radius:12px;

    padding:20px;
}

.modal-box h2{
    margin-bottom:15px;
    font-size:18px;
}

.modal-box input{
    width:100%;
    height:44px;

    padding:0 12px;

    border-radius:8px;

    border:1px solid #363b45;

    background:#292e38;

    color:white;

    outline:none;

    margin-bottom:12px;
}

.modal-buttons{
    display:flex;
    gap:8px;
}

.modal-buttons button{
    flex:1;

    height:42px;

    border:0;

    border-radius:8px;

    color:white;

    cursor:pointer;
}

.cancel{
    background:#363b45;
}

.confirm{
    background:#3b82f6;
}

/* RESPONSIVO */

@media(max-width:500px){

    .chat{
        max-width:none;
    }

    .messages{
        padding:10px;
    }

    .room{
        padding:10px;
    }

    .message{
        max-width:88%;
    }

}

@media(max-width:360px){

    .header h1{
        font-size:17px;
    }

    .input-area{
        padding-left:5px;
        padding-right:5px;
    }

    .emoji-button,
    .send{
        width:40px;
        height:40px;
    }

    .input-area input{
        height:40px;
    }

}

</style>
</head>

<body>

<div class="chat">

<header class="header">

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>

/* =====================================
   ELEMENTOS
===================================== */

const status =
    document.getElementById("status");

const myId =
    document.getElementById("myId");

const peerId =
    document.getElementById("peerId");

const connectBtn =
    document.getElementById("connectBtn");

const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");


/* =====================================
   PEERJS
===================================== */

let peer;

let connection = null;


/* =====================================
   CRIAR PEER
===================================== */

function iniciarPeer(){

    status.textContent =
        "Conectando...";

    status.style.color =
        "#ffb000";


    peer = new Peer();


    peer.on("open", function(id){

        console.log(
            "Meu Peer ID:",
            id
        );


        myId.value = id;

        myId.placeholder = "";


        status.textContent =
            "Online";

        status.style.color =
            "#22c55e";

    });


    peer.on("connection", function(conn){

        console.log(
            "Conexão recebida:",
            conn.peer
        );


        connection = conn;

        configurarConexao(conn);

    });


    peer.on("error", function(error){

        console.error(
            "PeerJS:",
            error
        );


        status.textContent =
            "Erro";

        status.style.color =
            "#ef4444";

    });


    peer.on("disconnected", function(){

        status.textContent =
            "Desconectado";

        status.style.color =
            "#ef4444";

    });

}


/* =====================================
   CONFIGURAR CONEXÃO
===================================== */

function configurarConexao(conn){

    conn.on("open", function(){

        status.textContent =
            "Conectado";

        status.style.color =
            "#22c55e";

    });


    conn.on("data", function(data){

        receberMensagem(data);

    });


    conn.on("close", function(){

        status.textContent =
            "Online";

        status.style.color =
            "#22c55e";

        connection = null;

    });


    conn.on("error", function(error){

        console.error(
            "Erro:",
            error
        );

    });

}


/* =====================================
   CONECTAR POR ID
===================================== */

connectBtn.addEventListener(
    "click",
    function(){

        const id =
            peerId.value.trim();


        if(!id){

            alert(
                "Digite o ID da pessoa."
            );

            return;

        }


        if(!peer){

            alert(
                "PeerJS ainda não está pronto."
            );

            return;

        }


        status.textContent =
            "Conectando...";

        status.style.color =
            "#ffb000";


        const conn =
            peer.connect(id);


        connection = conn;


        configurarConexao(conn);

    }
);


/* =====================================
   ENVIAR MENSAGEM
===================================== */

function enviarMensagem(){

    const texto =
        messageInput.value.trim();


    if(!texto){
        return;
    }


    if(!connection){

        alert(
            "Você ainda não está conectado."
        );

        return;

    }


    if(!connection.open){

        alert(
            "A conexão ainda não está pronta."
        );

        return;

    }


    const dados = {

        tipo: "mensagem",

        texto: texto,

        horario:
            Date.now()

    };


    connection.send(dados);


    mostrarMensagem(
        "Você",
        texto,
        true
    );


    messageInput.value = "";

    messageInput.focus();

}


/* =====================================
   RECEBER MENSAGEM
===================================== */

function receberMensagem(data){

    if(
        !data ||
        data.tipo !== "mensagem"
    ){

        return;

    }


    mostrarMensagem(
        "Pessoa",
        data.texto,
        false
    );

}


/* =====================================
   MOSTRAR MENSAGEM
===================================== */

function mostrarMensagem(
    nome,
    texto,
    minha
){

    const mensagem =
        document.createElement("div");


    mensagem.className =
        "message";


    if(minha){

        mensagem.classList.add(
            "me"
        );

    }


    mensagem.innerHTML = `

        <div class="name">
            ${escapeHTML(nome)}
        </div>

        <div class="text">
            ${escapeHTML(texto)}
        </div>

    `;


    messages.appendChild(
        mensagem
    );


    messages.scrollTop =
        messages.scrollHeight;

}


/* =====================================
   BOTÃO ENVIAR
===================================== */

sendBtn.addEventListener(
    "click",
    enviarMensagem
);


/* =====================================
   ENTER
===================================== */

messageInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            enviarMensagem();

        }

    }
);


/* =====================================
   EMOJIS
===================================== */

const emojiButton =
    document.getElementById(
        "emojiButton"
    );

const emojiPanel =
    document.getElementById(
        "emojiPanel"
    );


emojiButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        emojiPanel.classList.toggle(
            "active"
        );

    }
);


emojiPanel
    .querySelectorAll("button")
    .forEach(function(button){

        button.addEventListener(
            "click",
            function(){

                messageInput.value +=
                    button.textContent;

                messageInput.focus();

            }
        );

    });


/* =====================================
   MENU
===================================== */

const menuButton =
    document.getElementById(
        "menuButton"
    );

const menu =
    document.getElementById(
        "menu"
    );

const connectionOption =
    document.getElementById(
        "connectionOption"
    );

const connectionPanel =
    document.getElementById(
        "connectionPanel"
    );


menuButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        menu.classList.toggle(
            "active"
        );

    }
);


connectionOption.addEventListener(
    "click",
    function(){

        connectionPanel.classList.toggle(
            "active"
        );

        menu.classList.remove(
            "active"
        );

    }
);


/* =====================================
   CRIAR SALA
===================================== */

const createRoomButton =
    document.getElementById(
        "createRoomButton"
    );

const roomModal =
    document.getElementById(
        "roomModal"
    );

const cancelRoom =
    document.getElementById(
        "cancelRoom"
    );

const confirmRoom =
    document.getElementById(
        "confirmRoom"
    );

const roomNameInput =
    document.getElementById(
        "roomNameInput"
    );

const roomList =
    document.getElementById(
        "roomList"
    );


const currentRoom =
    document.getElementById(
        "currentRoom"
    );

const currentRoomName =
    document.getElementById(
        "currentRoomName"
    );

const leaveRoom =
    document.getElementById(
        "leaveRoom"
    );


let selectedRoom = null;


createRoomButton.addEventListener(
    "click",
    function(){

        roomModal.classList.add(
            "active"
        );

        roomNameInput.focus();

    }
);


cancelRoom.addEventListener(
    "click",
    function(){

        roomModal.classList.remove(
            "active"
        );

        roomNameInput.value = "";

    }
);


confirmRoom.addEventListener(
    "click",
    function(){

        const name =
            roomNameInput.value.trim();


        if(!name){

            alert(
                "Digite o nome da sala."
            );

            return;

        }


        const room =
            document.createElement(
                "div"
            );


        room.className =
            "room";


        room.dataset.room =
            "room-" + Date.now();


        room.innerHTML = `

            <div class="room-info">

                <div class="room-name">
                    💬 ${escapeHTML(name)}
                </div>

                <div class="room-users">
                    👥 0 pessoas
                </div>

            </div>

            <button class="join-room">
                Entrar
            </button>

        `;


        roomList.appendChild(
            room
        );


        room
            .querySelector(
                ".join-room"
            )
            .addEventListener(
                "click",
                function(){

                    selectedRoom =
                        room.dataset.room;

                    currentRoomName.textContent =
                        "💬 " + name;

                    currentRoom.classList.add(
                        "active"
                    );

                }
            );


        roomModal.classList.remove(
            "active"
        );

        roomNameInput.value = "";

    }
);


leaveRoom.addEventListener(
    "click",
    function(){

        selectedRoom = null;

        currentRoom.classList.remove(
            "active"
        );

    }
);


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(text){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


/* =====================================
   FECHAR ELEMENTOS
===================================== */

document.addEventListener(
    "click",
    function(event){

        if(
            !menu.contains(event.target) &&
            event.target !== menuButton
        ){

            menu.classList.remove(
                "active"
            );

        }


        if(
            !emojiPanel.contains(
                event.target
            ) &&
            event.target !== emojiButton
        ){

            emojiPanel.classList.remove(
                "active"
            );

        }

    }
);


/* =====================================
   INICIAR PEERJS
===================================== */

iniciarPeer();

</script>
